# Build the Fineract boot JAR and deploy it to the KC24 production host.
#
# Manual only: Actions -> "Deploy to Production" -> Run workflow (pick the branch).
# Nothing triggers it automatically.
#
# Required setup (one-time):
#   - Environment "production" with secret PROD_SSH_KEY: a private key whose public half
#     is in ~ubuntu/.ssh/authorized_keys on the host (ubuntu has passwordless sudo).
#   - Optionally add required reviewers to the "production" environment.
#
# Rollback: before installing, the running JAR is copied to fineract-provider.jar.last-good,
# but only if the service is healthy at that moment. If the new JAR does not become healthy,
# last-good is restored. Every deploy also keeps a timestamped .bak-* copy (newest 5).

name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production

    env:
      PROD_HOST: ubuntu@208.122.28.192
      # Public host key, pinned so the runner never trusts an unknown server.
      PROD_KNOWN_HOSTS: 208.122.28.192 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGOusg3DDq4a38Q8wr3MIkRhcCk7TRP3visKlAfrEgBv

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Fail fast: a malformed changelog stops Fineract from starting at all.
      - name: Validate Liquibase changelog XML
        run: |
          git ls-files -z '*db/changelog/*.xml' '*db/custom-changelog/*.xml' | python3 -I -c '
          import sys, xml.etree.ElementTree as ET
          paths = [p for p in sys.stdin.read().split("\0") if p]
          bad = 0
          for p in paths:
              try:
                  root = ET.parse(p).getroot().tag.rsplit("}", 1)[-1]
                  if root != "databaseChangeLog":
                      raise ValueError(f"root element is <{root}>, expected <databaseChangeLog>")
              except (ET.ParseError, ValueError) as e:
                  bad += 1
                  print(f"::error file={p}::{e}")
          print(f"checked {len(paths)} changelog files, {bad} invalid")
          sys.exit(1 if bad else 0)
          '

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true

      - name: Build boot JAR
        run: ./gradlew --no-daemon --console=plain :fineract-provider:bootJar -x test

      - name: Locate JAR
        id: jar
        run: |
          jar=$(find fineract-provider/build/libs -maxdepth 1 -name 'fineract-provider-*.jar' ! -name '*-plain.jar' | head -1)
          if [[ -z "$jar" ]]; then
            echo "::error::No boot JAR found in fineract-provider/build/libs"
            exit 1
          fi
          ls -la "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$jar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [[ -z "$PROD_SSH_KEY" ]]; then
            echo "::error::Secret PROD_SSH_KEY is not set on the production environment"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          ssh "$PROD_HOST" 'echo connected to $(hostname)'

      - name: Upload JAR
        env:
          JAR_PATH: ${{ steps.jar.outputs.path }}
          JAR_SHA256: ${{ steps.jar.outputs.sha256 }}
        run: |
          scp "$JAR_PATH" "$PROD_HOST:/tmp/fineract-provider.jar.new"
          ssh "$PROD_HOST" "echo '$JAR_SHA256  /tmp/fineract-provider.jar.new' | sha256sum -c -"

      - name: Install and restart
        run: |
          ssh "$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          JAR=/opt/fineract/fineract-provider.jar
          LAST_GOOD=/opt/fineract/fineract-provider.jar.last-good
          NEW=/tmp/fineract-provider.jar.new
          HEALTH_URL=http://localhost:8080/fineract-provider/actuator/health
          TS=$(date +%Y%m%d-%H%M%S)

          is_healthy() {
            curl -sf "$HEALTH_URL" | grep -q '"status":"UP"'
          }

          wait_healthy() {
            for _ in $(seq 1 72); do
              is_healthy && return 0
              sleep 5
            done
            return 1
          }

          # Only a JAR seen healthy becomes the rollback target. If the service is down
          # now, keep the previous last-good and label this backup as unhealthy.
          if is_healthy; then
            echo "==> Current service is UP; saving it as rollback target"
            sudo cp -p "$JAR" "$LAST_GOOD"
            sudo cp -p "$JAR" "$JAR.bak-$TS"
          else
            echo "::warning::Current service is NOT healthy; it will not be used for rollback"
            sudo cp -p "$JAR" "$JAR.bak-$TS-unhealthy"
          fi
          ls -1t "$JAR".bak-* | tail -n +6 | xargs -r sudo rm -f --

          echo "==> Installing new JAR and restarting fineract"
          sudo install -o fineract -g fineract -m 644 "$NEW" "$JAR"
          rm -f "$NEW"
          sudo systemctl restart fineract

          echo "==> Waiting for health check (up to 6 minutes)"
          if wait_healthy; then
            echo "==> Deployment successful, service is UP"
            exit 0
          fi

          echo "::error::New JAR did not become healthy"
          sudo journalctl -u fineract --since "-7 min" --no-pager | grep -E "ERROR|Caused by" | cut -c1-400 | head -40 || true

          if [[ ! -f "$LAST_GOOD" ]]; then
            echo "::error::No last-good JAR on the host, so nothing to roll back to; fix the host manually"
            exit 1
          fi

          echo "==> Rolling back to $LAST_GOOD"
          sudo install -o fineract -g fineract -m 644 "$LAST_GOOD" "$JAR"
          sudo systemctl restart fineract
          if wait_healthy; then
            echo "::error::Deploy failed; rolled back to last-good JAR, which is UP"
          else
            echo "::error::Deploy failed and the last-good JAR is not healthy either; check the host"
          fi
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
